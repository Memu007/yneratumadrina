<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>El Viejo y su Casa Limpia — Inera Sara</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="juego" aria-label="El Viejo y su Casa Limpia: tocá el patio, la casa o la vereda para ir y mantené apretado para trabajar"></canvas>
<script src="../../comun/lienzo.js"></script>
<script src="logica.js"></script>
<script>
  const { ANCHO, ALTO } = Lienzo;
  const V = ViejoCasaLimpia;
  const CLAVE_RECORD = 'inera-sara-viejo-casa-limpia';
  const canvas = document.getElementById('juego');
  const ctx = Lienzo.crearLienzo(canvas);

  // ---------- Escenario: una sola casa vista desde arriba ----------
  // Franjas de pantalla de cada zona (patio atrás, casa, jardín de adelante + vereda).
  const FRANJAS = { patio: [0, 150], casa: [150, 330], vereda: [330, 540] };
  const NOMBRES = { patio: 'Patio', casa: 'Casa', vereda: 'Adelante' };
  // Recorrido del viejo: la posición lógica 0..2 se convierte en este camino,
  // que pasa por la puerta de atrás (0.5) y la de adelante (1.5).
  const CAMINO = [
    { y: 0, px: 190, py: 112 },
    { y: 0.5, px: 120, py: 160 },
    { y: 1, px: 236, py: 236 },
    { y: 1.5, px: 125, py: 350 },
    { y: 2, px: 165, py: 500 },
  ];

  const CAUSAS = {
    patio: 'El pasto te tapó.',
    casa: 'No se ve nada por las ventanas.',
    vereda: 'La vereda da vergüenza.',
  };
  const REINTENTAR = {
    patio: '¿Vas a dejar que gane el pasto?',
    casa: '¿Vas a dejar que ganen los nietos?',
    vereda: '¿Vas a dejar que gane el perro?',
  };
  // Todo lo que dice cada uno, por situación. Muchas por lista para que no se repitan.
  const FRASES = {
    espantar: ['¡Juiiiira!', '¡Juira, perro sarnoso!', '¡Chucho! ¡Chucho!', '¡Juira, juira, juira!', '¡Fuera de mi vereda, bicho!', '¡Ni lo pienses, pulgoso!', '¡Andá a ensuciar a tu casa!', '¡Te conozco, eh! ¡Juira!'],
    perroSolo: ['¡Me dejó un regalito!', '¡Justo en el medio de la vereda!', '¡Ese chucho me tiene de punto!', '¡Come mejor que yo ese perro!', '¡Siempre en el mismo baldosón!', '¡Lo voy a agarrar a escobazos!'],
    perroDuenoDistraido: ['¡Y encima no la levanta!', '¡La bolsita, sinvergüenza!', '¡Te vi, eh! ¡Te vi!', '¡La próxima te la dejo en la puerta!', '¡Silbá, silbá nomás!'],
    duenoAtrapado: ['Uh... el viejo.', '¡Ya va, ya va!', 'Ehh... ¡no es lo que parece!', '¡Recién llegamos!'],
    duenoSeVa: ['¡Ni que fuera tu vereda!', '¡Viejo buchón!', '¡Qué amargado!', '¡Uy, el vigilante del barrio!', '¡Calmate, jubilado!', '¡Andá a regar las plantas!'],
    viejoGana: ['¡Es MI vereda, nene!', '¡Y que no se repita!', '¡Así me gusta!', '¡Llevate la bolsita, campeón!', '¡Educación, se llama!'],
    pibeTiro: ['¡El tacho está en la esquina!', '¡Mal educado!', '¡Te vi, eh! ¡Te vi!', '¡Esta juventud!', '¡Levantá eso, atorrante!'],
    escobazos: ['¡Tomá, atorrante!', '¡Te voy a dar basura a vos!', '¡Rajá de acá, vago!', '¡La escoba no perdona!', '¡Escobazo y a tu casa!', '¡Andá a tirar eso a tu vereda!'],
    retarNietos: ['¡LAS ZAPATILLAS!', '¡Alto ahí! ¡Zapatillas afuera!', '¡En medias, que encerá el abuelo!', '¡Ni un paso más con ese barro!', '¡Las zapas en la puerta, chicos!'],
    nietosObedecen: ['¡Uy, el abuelo!', 'Sí, abu...', '¡Perdón, abu!', 'Bueno, bueno...', '¡Fue él!'],
    retarVecino: ['¡Te vi, eh! ¡Guardá esa bolsa!', '¡Ni se le ocurra, vecino!', '¡Esa bolsa va a SU tacho!', '¡Lo tengo junado, eh!', '¡Ahí lo quiero ver!'],
    vecinoSeEsconde: ['Eh... ¡buen día, don!', 'Nada, nada... ¡estaba regando!', '¡Uy! Me confundí de patio.', 'Ehh... ¿qué tal la familia?', 'Yo no fui, eh.'],
    pibeHuye: ['¡Ay! ¡Perdón, don!', '¡Uy, el viejo de la escoba!', '¡No me pegue, abuelo!', '¡Era una joda!', '¡Ya me voy, ya me voy!'],
    vecinoPatio: ['¡Eh, que no es un basural!', '¡Vecino, lo estoy viendo!', '¡Le devuelvo la bolsa por arriba, eh!', '¡Otra bolsa y llamo al patrullero!', '¡Qué vecino, mamita!'],
    nietos: ['¡Las zapatillas, chicos!', '¡Recién encerado!', '¡No se corre adentro!', '¡¿Quién les dio caramelos?!', '¡Igualitos a su padre!', '¡Ya le cuento a su abuela!', '¡Las manos en el vidrio no!', '¡Pies limpios o a la calle!'],
    // Cuando no pasa nada, se queja de lo que está peor.
    patio: ['¡Este pasto crece de prepo!', '¡Acá se pierde una vaca!', '¡Ya me llega a las rodillas!', '¡Mañana me compro una cabra!', '¡Parece Misiones el patio!', '¡Ni que lo regara!'],
    casa: ['¡No se ve ni el sol por la ventana!', '¡Esas ventanas parecen esmeriladas!', '¡Mirá las marcas de los dedos!', '¡Esto con diario y alcohol sale!'],
    vereda: ['¡Qué dirán los vecinos!', '¡La vereda es la cara de la casa!', '¡Esta vereda la baldeaba todos los días!', '¡Mirá las hojas, otoño eterno!'],
    // Al ponerse a trabajar en cada lugar.
    trabajarPatio: ['¡Tomá, yuyo!', '¡Al ras, como en la colimba!', '¡Cortadito como cancha de golf!'],
    trabajarCasa: ['¡Con diario queda mejor!', '¡Así brilla!', '¡A ver si ahora entra el sol!'],
    trabajarVereda: ['¡Escoba y a la calle!', '¡Que brille la baldosa!', '¡Ni una hoja, ni una!'],
    caminar: ['Ufff...', '¡Ay, la cadera!', 'Ya voy, ya voy...', '¡Mis rodillas!', 'Despacito...'],
  };


  const entrada = { zona: null, trabajar: false, puntero: null };
  let estado = V.crearEstado(Date.now());
  let record = Lienzo.leerRecord(CLAVE_RECORD);
  let recordAnterior = record; // el récord antes de la última partida, para no festejar un empate
  let reloj = 0; // tiempo de pantalla, para animaciones
  let sacudon = 0;
  let particulas = [];
  let pisadas = []; // barro que dejan los nietos al correr
  let toques = []; // anillos donde tocó el jugador
  let actores = []; // personajes en escena, uno por evento
  let conocidos = new WeakSet();
  let globo = null; // { texto, hasta }
  let proximaFraseSuelta = 9;
  let zonaQuieta = 1; // última zona donde el viejo estuvo parado
  let estabaCaminando = false;
  let distanciaCaminada = 0;
  let posViejoPrevia = null;
  let finDesde = 0;
  let proximoSonidoTrabajo = 0;
  let escobazoHasta = 0; // mientras dure, el viejo revolea la escoba
  let decirLuego = null; // respuesta del viejo que llega un momento después
  let estabaTrabajando = false;

  // ---------- Sonido (WebAudio, sin archivos) ----------
  let audio = null;
  function activarAudio() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
    } catch {
      audio = null;
    }
  }
  function tono(tipo, desde, hasta, dur, volumen) {
    if (!audio) return;
    const t = audio.currentTime;
    const osc = audio.createOscillator();
    const g = audio.createGain();
    osc.type = tipo;
    osc.frequency.setValueAtTime(desde, t);
    osc.frequency.exponentialRampToValueAtTime(hasta, t + dur);
    g.gain.setValueAtTime(volumen, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g).connect(audio.destination);
    osc.start(t);
    osc.stop(t + dur);
  }
  function ruido(dur, frecuencia, volumen) {
    if (!audio) return;
    const t = audio.currentTime;
    const buffer = audio.createBuffer(1, Math.floor(audio.sampleRate * dur), audio.sampleRate);
    const datos = buffer.getChannelData(0);
    for (let i = 0; i < datos.length; i++) datos[i] = Math.random() * 2 - 1;
    const fuente = audio.createBufferSource();
    const filtro = audio.createBiquadFilter();
    const g = audio.createGain();
    fuente.buffer = buffer;
    filtro.type = 'bandpass';
    filtro.frequency.value = frecuencia;
    g.gain.setValueAtTime(volumen, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    fuente.connect(filtro).connect(g).connect(audio.destination);
    fuente.start(t);
  }
  const SONIDOS = {
    barrer: () => ruido(0.16, 1400, 0.25),
    frotar: () => ruido(0.1, 3200, 0.12),
    cortar: () => { tono('square', 2400, 1800, 0.04, 0.06); setTimeout(() => tono('square', 2600, 1900, 0.04, 0.06), 70); },
    plop: () => tono('sine', 320, 70, 0.22, 0.5),
    fuera: () => { tono('square', 520, 760, 0.1, 0.08); setTimeout(() => tono('square', 760, 520, 0.12, 0.08), 110); },
    perder: () => tono('triangle', 440, 90, 0.9, 0.3),
    silbido: () => { tono('sine', 900, 1300, 0.12, 0.05); setTimeout(() => tono('sine', 900, 1300, 0.12, 0.05), 180); },
    pst: () => { ruido(0.07, 5000, 0.12); setTimeout(() => ruido(0.12, 4200, 0.12), 120); },
    paf: () => { ruido(0.08, 500, 0.5); tono('square', 200, 90, 0.08, 0.08); },
    ladrido: () => { tono('square', 380, 240, 0.08, 0.07); setTimeout(() => tono('square', 400, 250, 0.08, 0.07), 140); },
  };
  function vibrar(ms) {
    try { navigator.vibrate && navigator.vibrate(ms); } catch { /* sin vibración */ }
  }

  // ---------- Entrada ----------
  function reiniciar() {
    estado = V.crearEstado(Date.now());
    // La partida nueva arranca con el viejo quieto en la casa, sin el destino de la anterior.
    entrada.zona = null;
    entrada.trabajar = false;
    entrada.puntero = null;
    particulas = [];
    pisadas = [];
    actores = [];
    conocidos = new WeakSet();
    globo = null;
    decirLuego = null;
    zonaQuieta = 1;
    proximaFraseSuelta = 9;
  }
  function zonaEnPantalla(y) {
    return V.ZONAS.findIndex((z) => y < FRANJAS[z][1]);
  }
  canvas.addEventListener('pointerdown', (e) => {
    activarAudio();
    if (estado.fase === 'fin') {
      if (reloj - finDesde > 0.8) reiniciar();
      return;
    }
    const p = Lienzo.puntoLogico(canvas, e);
    const zona = zonaEnPantalla(p.y);
    if (zona < 0) return; // tocó el marcador de abajo
    entrada.zona = zona;
    entrada.trabajar = true;
    entrada.puntero = e.pointerId;
    toques.push({ x: p.x, y: p.y, vida: 0.4 });
  });
  for (const tipo of ['pointerup', 'pointercancel', 'pointerleave']) {
    // Solo suelta el dedo que manda: otro dedo que se levanta no corta el trabajo.
    canvas.addEventListener(tipo, (e) => { if (e.pointerId === entrada.puntero) entrada.trabajar = false; });
  }
  const TECLAS_ZONA = { ArrowUp: -1, ArrowDown: 1 };
  window.addEventListener('keydown', (e) => {
    activarAudio();
    if (estado.fase === 'fin') {
      if (e.key === ' ' && reloj - finDesde > 0.8) reiniciar();
      return;
    }
    if (e.key in TECLAS_ZONA) entrada.zona = V.zonaActual(estado) + TECLAS_ZONA[e.key];
    if (e.key === ' ') entrada.trabajar = true;
  });
  window.addEventListener('keyup', (e) => { if (e.key === ' ') entrada.trabajar = false; });

  // ---------- Utilidades de dibujo y animación ----------
  // Saca frases de una bolsa mezclada: no repite hasta haber dicho todas las de esa lista.
  const bolsas = new Map();
  function azar(lista) {
    let bolsa = bolsas.get(lista);
    if (!bolsa || bolsa.length === 0) {
      bolsa = [...lista].sort(() => Math.random() - 0.5);
      bolsas.set(lista, bolsa);
    }
    return bolsa.pop();
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const limitar = (t) => Math.max(0, Math.min(1, t));
  const suave = (t) => t * t * (3 - 2 * t);
  const salirRebotando = (t) => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2);

  function posicionViejo(y) {
    for (let i = 1; i < CAMINO.length; i++) {
      const a = CAMINO[i - 1];
      const b = CAMINO[i];
      if (y <= b.y) {
        const t = (y - a.y) / (b.y - a.y);
        return { x: lerp(a.px, b.px, t), y: lerp(a.py, b.py, t) };
      }
    }
    const ultimo = CAMINO[CAMINO.length - 1];
    return { x: ultimo.px, y: ultimo.py };
  }

  function circulo(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  function linea(x1, y1, x2, y2, ancho, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = ancho;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  function sombra(x, y, ancho) {
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(x, y, ancho, ancho * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---------- Personajes ----------
  // El viejo: calvo con mechones, cejas y bigote blancos, lentes, musculosa y pantuflas.
  function dibujarViejo(x, y, { paso, trabajando, triste, herramienta }) {
    const PIEL = '#f1c6a0';
    const BLANCO = '#f7f7f2';
    const zancada = Math.sin(paso) * 6;
    const rebote = trabajando ? Math.sin(reloj * 26) * 2 : -Math.abs(Math.sin(paso)) * 2;
    sombra(x, y, 18);
    ctx.save();
    ctx.translate(x, y + rebote);
    linea(-6, -30, -6 + zancada, -4, 6, PIEL);
    linea(6, -30, 6 - zancada, -4, 6, PIEL);
    ctx.fillStyle = '#7a4a2a';
    ctx.beginPath(); ctx.ellipse(-7 + zancada, -2, 9, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7 - zancada, -2, 9, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(0.17); // encorvado
    ctx.fillStyle = '#6b4b2f';
    ctx.fillRect(-13, -40, 26, 13);
    ctx.fillStyle = BLANCO;
    ctx.beginPath(); ctx.roundRect(-14, -68, 28, 32, 6); ctx.fill();
    if (triste) {
      linea(-13, -62, -20, -46, 5, PIEL); linea(-20, -46, -12, -40, 5, PIEL);
      linea(13, -62, 20, -46, 5, PIEL); linea(20, -46, 12, -40, 5, PIEL);
    } else {
      linea(-13, -62, -18 - zancada * 0.5, -40, 5, PIEL);
      const mano = herramienta === 'casa' && trabajando
        ? { x: 28 + Math.cos(reloj * 9) * 8, y: -66 + Math.sin(reloj * 9) * 8 }
        : { x: 26, y: -48 };
      linea(13, -62, mano.x, mano.y, 5, PIEL);
      if (herramienta && trabajando) dibujarHerramienta(herramienta, mano.x, mano.y);
    }
    circulo(0, -82, 14, PIEL);
    ctx.strokeStyle = BLANCO;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, -82, 13, Math.PI * 0.75, Math.PI * 1.05); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -82, 13, Math.PI * 1.95, Math.PI * 0.25); ctx.stroke();
    linea(-10, -90, -3, triste ? -91 : -88, 3, BLANCO);
    linea(3, triste ? -91 : -88, 10, -90, 3, BLANCO);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(-5, -84, 4, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(5, -84, 4, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = BLANCO;
    ctx.beginPath(); ctx.ellipse(0, -76, 8, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    if (triste) {
      ctx.strokeStyle = '#7a3b2a';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, -69, 4, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    }
    ctx.restore();
  }

  function dibujarHerramienta(zona, x, y) {
    if (zona === 'patio') {
      // Tijera de podar que se abre y se cierra
      const apertura = Math.abs(Math.sin(reloj * 14)) * 0.5;
      linea(x, y, x + 14, y - 4, 4, '#c0392b');
      linea(x + 14, y - 4, x + 32, y - 10 - apertura * 14, 3, '#aaa');
      linea(x + 14, y - 4, x + 32, y - 2 + apertura * 14, 3, '#aaa');
    } else if (zona === 'casa') {
      // Trapo frotando el vidrio
      ctx.fillStyle = '#4aa3df';
      ctx.beginPath(); ctx.roundRect(x - 2, y - 8, 14, 12, 3); ctx.fill();
    } else {
      // Escoba que barre de lado a lado; a escobazos, revoleada a lo loco.
      const barrido = reloj < escobazoHasta ? Math.sin(reloj * 34) * 22 : Math.sin(reloj * 12) * 8;
      linea(x - 6, y - 28, x + 8 + barrido, y + 34, 3, '#a0743f');
      ctx.save();
      ctx.translate(x + 10 + barrido, y + 38);
      ctx.rotate(-0.3 + barrido * 0.02);
      ctx.fillStyle = '#d9b44a';
      ctx.fillRect(-10, 0, 20, 10);
      ctx.restore();
    }
  }

  function dibujarPerro(x, y, { agachado, corriendo, dir = 1 }) {
    const MARRON = '#8b5a2b';
    const pata = agachado ? 0 : Math.sin(reloj * (corriendo ? 34 : 18)) * 4;
    const temblor = agachado ? Math.sin(reloj * 70) * 1 : 0;
    sombra(x, y + 2, 18);
    ctx.save();
    ctx.translate(x + temblor, y);
    ctx.scale(dir, 1);
    linea(-12, -8, -12 + pata, 2, 4, MARRON);
    linea(10, -8, 10 - pata, 2, 4, MARRON);
    ctx.fillStyle = MARRON;
    ctx.beginPath(); ctx.ellipse(0, agachado ? -6 : -12, 18, 9, agachado ? -0.25 : 0, 0, Math.PI * 2); ctx.fill();
    circulo(20, -22, 8, MARRON);
    ctx.fillStyle = '#5a3418';
    ctx.beginPath(); ctx.ellipse(16, -24, 3, 7, 0.4, 0, Math.PI * 2); ctx.fill();
    circulo(24, -24, 1.5, '#111');
    circulo(10, -18, 2.5, '#e74c3c'); // collar
    linea(-17, -14, -26, -24 + Math.sin(reloj * 18) * 4, 3, MARRON); // cola
    ctx.restore();
  }

  function dibujarPersona(x, y, { pelo, remera, chico, caminando, corriendo, dir = 1, brazoArriba, agachado }) {
    const escala = chico ? 0.65 : 1;
    const vel = corriendo ? 24 : 12;
    const paso = caminando || corriendo ? Math.sin(reloj * vel) * (corriendo ? 8 : 5) : 0;
    sombra(x, y, 14 * escala);
    ctx.save();
    ctx.translate(x, y - (corriendo ? Math.abs(Math.sin(reloj * vel)) * 3 : 0));
    ctx.scale(escala * dir, escala);
    if (agachado) {
      // En cuclillas: rodillas dobladas y el cuerpo más abajo, juntando la caca con la bolsa.
      linea(-5, -16, 8, -12, 6, '#33475b'); linea(8, -12, 4, 0, 6, '#33475b');
      ctx.translate(0, 16);
      ctx.rotate(0.35);
    } else {
      linea(-5, -30, -5 + paso, 0, 6, '#33475b');
      linea(5, -30, 5 - paso, 0, 6, '#33475b');
    }
    ctx.fillStyle = remera;
    ctx.beginPath(); ctx.roundRect(-12, -62, 24, 34, 6); ctx.fill();
    linea(-10, -58, -14 - paso * 0.5, -36, 5, '#e8b48a');
    if (brazoArriba) linea(10, -58, 18, -82, 5, '#e8b48a');
    else linea(10, -58, 14 + paso * 0.5, -36, 5, '#e8b48a');
    circulo(0, -74, 12, '#e8b48a');
    ctx.fillStyle = pelo;
    ctx.beginPath(); ctx.arc(0, -77, 12, Math.PI, 0); ctx.fill();
    circulo(6, -75, 1.5, '#111');
    ctx.restore();
  }

  function dibujarCaca(x, y) {
    circulo(x, y, 7, '#6b3e1e');
    circulo(x, y - 6, 5, '#7a4824');
    circulo(x, y - 11, 3, '#8b5a2b');
  }
  function dibujarBasura(x, y, k) {
    if (k % 2) {
      ctx.fillStyle = '#fafafa';
      ctx.fillRect(x - 5, y - 12, 10, 12);
      ctx.fillStyle = '#d63031';
      ctx.fillRect(x - 5, y - 12, 10, 3);
    } else {
      ctx.fillStyle = '#e9e2cf'; // papel arrugado
      ctx.beginPath(); ctx.moveTo(x - 7, y); ctx.lineTo(x - 3, y - 9); ctx.lineTo(x + 6, y - 6); ctx.lineTo(x + 7, y + 2); ctx.closePath(); ctx.fill();
    }
  }
  // Bolsa de consorcio negra, atada arriba con dos orejitas.
  function dibujarBolsa(x, y) {
    ctx.fillStyle = '#2b2b2b';
    ctx.beginPath();
    ctx.moveTo(x - 4, y - 11);
    ctx.quadraticCurveTo(x - 14, y - 4, x - 11, y + 7);
    ctx.quadraticCurveTo(x, y + 11, x + 11, y + 7);
    ctx.quadraticCurveTo(x + 14, y - 4, x + 4, y - 11);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath(); ctx.ellipse(x - 5, y - 15, 4, 2.5, -0.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 5, y - 15, 4, 2.5, 0.6, 0, Math.PI * 2); ctx.fill();
    linea(x - 6, y - 2, x - 7, y + 4, 2, 'rgba(255,255,255,0.25)'); // brillo del plástico
    ctx.fillStyle = '#e9e2cf'; // asoma un papel
    ctx.fillRect(x - 2, y - 13, 4, 4);
  }

  // ---------- Escenario ----------
  // Posiciones fijas para la mugre, así no titila cada cuadro.
  // Hojas secas: la mugre que junta la vereda sola, sin que nadie tire nada.
  const HOJAS = [[240, 495], [300, 470], [60, 505], [205, 465], [275, 512], [95, 470], [190, 500], [40, 470], [250, 380], [70, 395], [300, 395], [160, 510]];
  // Dónde quedó tirado un objeto: `lugar` (0..1) lo decide la lógica al crear el evento.
  function posicionObjeto(zona, lugar) {
    const fila = (lugar * 997) % 1;
    if (zona === 'patio') return { x: 60 + lugar * 220, y: 75 + fila * 55 };
    return { x: 40 + lugar * 240, y: 466 + fila * 46 };
  }
  function dibujarObjetos(zona) {
    for (const o of estado.objetos[zona]) {
      const { x, y } = posicionObjeto(zona, o.lugar);
      if (o.tipo === 'caca') dibujarCaca(x, y);
      else if (o.tipo === 'vaso') dibujarBasura(x, y, 1);
      else dibujarBolsa(x, y);
    }
  }
  function dibujarHoja(x, y) {
    ctx.fillStyle = '#c98b2b';
    ctx.beginPath(); ctx.ellipse(x, y, 6, 3, 0.6, 0, Math.PI * 2); ctx.fill();
  }
  const PISADAS_FIJAS = Array.from({ length: 14 }, (_, i) => [40 + ((i * 83) % 280), 225 + ((i * 37) % 95)]);

  function dibujarPatio(nivel) {
    ctx.fillStyle = '#86c95f';
    ctx.fillRect(0, 0, ANCHO, 150);
    // Tendedero
    linea(20, 38, 110, 38, 1.5, '#666');
    [['#e74c3c', 30], ['#3498db', 55], ['#f1c40f', 82]].forEach(([c, x]) => {
      ctx.fillStyle = c;
      ctx.fillRect(x, 38, 16, 20 + Math.sin(reloj * 2 + x) * 2);
    });
    // Pasto que crece: matas más altas cuanto más descuidado
    const alto = 6 + (nivel / 100) * 60;
    ctx.strokeStyle = '#3f8f2a';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let fila = 0; fila < 5; fila++) {
      const base = 55 + fila * 24;
      for (let x = 8 + (fila % 2) * 9; x < ANCHO; x += 18) {
        const h = alto * (0.75 + ((x * 13 + fila * 7) % 10) / 40);
        const viento = Math.sin(reloj * 1.6 + x * 0.05) * (2 + h * 0.08);
        for (const d of [-4, 0, 4]) {
          ctx.moveTo(x + d, base);
          ctx.lineTo(x + d * 1.6 + viento, base - h);
        }
      }
    }
    ctx.stroke();
    dibujarObjetos('patio');
    ctx.fillStyle = '#b5835a'; // medianera con el vecino
    ctx.fillRect(ANCHO - 12, 0, 12, 150);
  }

  function dibujarCasa(nivel) {
    // Piso de madera
    ctx.fillStyle = '#d9b38c';
    ctx.fillRect(0, 150, ANCHO, 182);
    ctx.strokeStyle = '#c49a72';
    ctx.lineWidth = 1;
    for (let y = 230; y < 330; y += 22) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(ANCHO, y); ctx.stroke(); }
    // Pared del fondo con la puerta al patio y dos ventanas
    ctx.fillStyle = '#f3e2c3';
    ctx.fillRect(0, 150, ANCHO, 58);
    ctx.fillStyle = '#7b5b3a';
    ctx.fillRect(0, 150, ANCHO, 7);
    ctx.fillStyle = '#6d4426';
    ctx.fillRect(100, 160, 42, 48);
    const suciedad = nivel / 100;
    for (const vx of [178, 270]) {
      ctx.fillStyle = '#fff';
      ctx.fillRect(vx - 4, 160, 70, 44);
      ctx.fillStyle = '#a9d6f5';
      ctx.fillRect(vx, 164, 62, 36);
      ctx.fillStyle = `rgba(110, 80, 40, ${suciedad * 0.75})`;
      ctx.fillRect(vx, 164, 62, 36);
      if (nivel < 25) linea(vx + 10, 194, vx + 24, 170, 3, 'rgba(255,255,255,0.8)'); // brillo de limpio
      // Manos de los nietos en el vidrio
      const manos = Math.floor(nivel / 25);
      for (let k = 0; k < manos; k++) {
        const mx = vx + 10 + ((k * 17) % 44);
        const my = 172 + ((k * 11) % 20);
        circulo(mx, my, 4, 'rgba(90, 60, 30, 0.6)');
        for (let d = 0; d < 4; d++) circulo(mx - 4 + d * 2.7, my - 6, 1.3, 'rgba(90, 60, 30, 0.6)');
      }
      linea(vx + 31, 164, vx + 31, 200, 3, '#fff');
    }
    // Barro en el piso
    const barro = Math.round(suciedad * PISADAS_FIJAS.length);
    ctx.fillStyle = 'rgba(92, 60, 30, 0.55)';
    for (const [px, py] of PISADAS_FIJAS.slice(0, barro)) {
      ctx.beginPath(); ctx.ellipse(px, py, 4, 6, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(px + 9, py - 7, 4, 6, 0.3, 0, Math.PI * 2); ctx.fill();
    }
    // Paredes laterales y frente cortado, con la puerta de calle
    ctx.fillStyle = '#7b5b3a';
    ctx.fillRect(0, 150, 7, 180);
    ctx.fillRect(ANCHO - 7, 150, 7, 180);
    ctx.fillRect(0, 326, 100, 6);
    ctx.fillRect(150, 326, ANCHO - 150, 6);
  }

  function dibujarAdelante(nivel) {
    // Jardín de adelante con canteros y caminito
    ctx.fillStyle = '#92d36e';
    ctx.fillRect(0, 332, ANCHO, 108);
    ctx.fillStyle = '#d8cfc0';
    ctx.fillRect(102, 332, 46, 100);
    for (const [fx, fy, c] of [[30, 360, '#e84393'], [60, 375, '#fdcb6e'], [210, 360, '#e84393'], [250, 378, '#fdcb6e'], [300, 362, '#a29bfe'], [330, 380, '#e84393']]) {
      circulo(fx, fy + 6, 7, '#3f8f2a');
      circulo(fx, fy, 5, c);
    }
    // Rejita del frente con portón abierto
    ctx.fillStyle = '#fff';
    for (let x = 4; x < ANCHO; x += 14) {
      if (x > 96 && x < 150) continue;
      ctx.fillRect(x, 418, 6, 22);
    }
    ctx.fillRect(0, 424, 98, 4);
    ctx.fillRect(150, 424, ANCHO - 150, 4);
    // Vereda y cordón
    ctx.fillStyle = '#c4c4c4';
    ctx.fillRect(0, 440, ANCHO, 82);
    ctx.strokeStyle = '#b0b0b0';
    ctx.lineWidth = 1;
    for (let x = 0; x < ANCHO; x += 40) { ctx.beginPath(); ctx.moveTo(x, 440); ctx.lineTo(x, 522); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(0, 481); ctx.lineTo(ANCHO, 481); ctx.stroke();
    ctx.fillStyle = '#8a8a8a';
    ctx.fillRect(0, 522, ANCHO, 18);
    const hojas = V.hojasSueltas(estado);
    HOJAS.slice(0, hojas).forEach(([x, y]) => dibujarHoja(x, y));
    dibujarObjetos('vereda');
  }

  function dibujarAlerta(zona) {
    // La zona se pone roja cuando se complica, y late cuando ya casi perdés.
    const nivel = estado.problemas[zona];
    if (nivel <= 50) return;
    const [y0, y1] = FRANJAS[zona];
    const latido = nivel > 75 ? 0.5 + 0.5 * Math.sin(reloj * 10) : 1;
    ctx.fillStyle = `rgba(230, 30, 30, ${((nivel - 50) / 50) * 0.3 * latido})`;
    ctx.fillRect(0, y0, ANCHO, y1 - y0);
  }

  function dibujarBarra(zona, i, caminando) {
    const [y0, y1] = FRANJAS[zona];
    // Mientras el viejo camina, la zona que dejó parpadea.
    if (caminando && i === zonaQuieta && Math.floor(reloj * 6) % 2 === 0) return;
    const nivel = estado.problemas[zona];
    const x = ANCHO - 32;
    const top = y0 + 40;
    const altoBarra = y1 - y0 - 52;
    const color = nivel > 75 ? '#e02020' : nivel > 50 ? '#f0a000' : '#2a9d3a';
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.roundRect(x, top, 20, altoBarra, 6); ctx.fill();
    const h = (altoBarra * nivel) / 100;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.roundRect(x, top + altoBarra - h, 20, h, 6); ctx.fill();
    circulo(x + 10, y0 + 24, 12, color);
    circulo(x + 6, y0 + 21, 1.8, '#111');
    circulo(x + 14, y0 + 21, 1.8, '#111');
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    if (nivel > 75) ctx.arc(x + 10, y0 + 33, 5, Math.PI * 1.15, Math.PI * 1.85);
    else if (nivel > 50) { ctx.moveTo(x + 5, y0 + 29); ctx.lineTo(x + 15, y0 + 29); }
    else ctx.arc(x + 10, y0 + 25, 5, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.font = 'bold 14px system-ui';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(NOMBRES[zona], 12, y0 + 16);
  }

  // ---------- Actores: cada evento entra, actúa y se va ----------
  function sincronizarActores(dt) {
    for (const e of estado.eventos) {
      if (!conocidos.has(e)) {
        conocidos.add(e);
        actores.push({ e, fase: 'entrando', s: 0, ninos: [], puteada: null });
        if (e.tipo === 'perro' && !e.conDueno) SONIDOS.ladrido();
        if (e.tipo === 'pibe') SONIDOS.silbido();
        if (e.tipo === 'vecino') SONIDOS.pst();
      }
    }
    for (const a of actores) {
      if (a.fase === 'entrando' && estado.recienCaidos.includes(a.e)) a.fase = 'saliendo';
      if (a.fase === 'entrando' && estado.recienEspantados.includes(a.e)) a.fase = 'huyendo';
      if (a.fase === 'entrando' && estado.recienLevantadas.includes(a.e)) a.fase = 'levantando';
      if (a.fase !== 'entrando') a.s += dt;
    }
    actores = actores.filter((a) => !(a.fase !== 'entrando' && a.s > 3));
  }

  function progreso(a) {
    return limitar(1 - a.e.aviso / a.e.avisoTotal);
  }

  // Devuelve una lista de { y, dibujar } para ordenar por profundidad con el viejo.
  function figurasActor(a) {
    const p = progreso(a);
    const tipo = `${a.e.tipo}-${a.e.zona}`;
    if (tipo === 'perro-vereda' && !a.e.conDueno) {
      // Perro suelto: ladra desde el borde, entra corriendo, olfatea y se agacha.
      // Si al llegar ve al viejo en la vereda, se escapa.
      const LLEGADA = V.CONFIG.espantable.llegada;
      const destino = posicionObjeto('vereda', a.e.lugar);
      const desdeIzquierda = (a.e.lugar * 7) % 1 < 0.5;
      const dir = desdeIzquierda ? 1 : -1;
      const llegada = destino.x + 18 * dir; // la cola queda justo donde cae la caca
      let px;
      let mira = dir;
      let corriendo = true;
      if (a.fase === 'entrando') {
        px = lerp(desdeIzquierda ? -40 : ANCHO + 40, llegada, suave(limitar(p / LLEGADA)));
        corriendo = p < LLEGADA;
      } else if (a.fase === 'saliendo') {
        px = llegada + a.s * 120 * dir;
      } else {
        mira = -dir;
        px = llegada - a.s * 380 * dir;
      }
      const olfatea = a.fase === 'entrando' && p >= LLEGADA && p < 0.72;
      const agachado = a.fase === 'entrando' && p >= 0.72;
      const ladra = a.fase === 'entrando' && p < 0.18;
      return [{ y: destino.y, dibujar: () => {
        dibujarPerro(px, destino.y, { agachado, corriendo, dir: mira });
        ctx.fillStyle = '#333';
        ctx.font = 'bold 14px system-ui';
        ctx.textAlign = 'center';
        if (olfatea) ctx.fillText('snif', px + 24 * mira, destino.y - 38);
        if (ladra) {
          // Aviso antes de que se vea: ladrido en el borde por donde va a entrar.
          ctx.font = 'bold 18px system-ui';
          ctx.textAlign = desdeIzquierda ? 'left' : 'right';
          ctx.fillText('¡GUAU!', desdeIzquierda ? 8 : ANCHO - 40, destino.y - 40);
        }
        if (agachado) ctx.fillText('...', px - 10 * mira, destino.y - 30);
      } }];
    }
    if (tipo === 'perro-vereda') {
      // Perro con dueño: frena y se agacha. Si el viejo no está, el dueño silba mirando para otro lado;
      // si el viejo lo ve, el dueño la levanta avergonzado y se va puteando.
      const destino = posicionObjeto('vereda', a.e.lugar);
      const llegada = destino.x + 18;
      let px;
      let duenoX;
      let duenoAgachado = false;
      let caminando;
      if (a.fase === 'entrando') {
        px = lerp(-60, llegada, suave(limitar(p / 0.6)));
        duenoX = px - 58;
        caminando = p < 0.6;
      } else if (a.fase === 'levantando') {
        // 0-0.4 s va hasta la caca, 0.4-1.1 s se agacha, después se van.
        const salida = Math.max(0, a.s - 1.1);
        px = llegada + salida * 110;
        duenoX = salida > 0 ? destino.x - 30 + salida * 110 : lerp(llegada - 58, destino.x - 30, suave(limitar(a.s / 0.4)));
        duenoAgachado = a.s > 0.4 && a.s < 1.1;
        caminando = a.s < 0.4 || salida > 0;
      } else {
        px = llegada + a.s * 90;
        duenoX = px - 58;
        caminando = true;
      }
      const perroAgachado = a.fase === 'entrando' && p > 0.65;
      const cacaVisible = (a.fase === 'entrando' && p > 0.95) || (a.fase === 'levantando' && a.s < 0.8);
      return [
        { y: destino.y - 22, dibujar: () => {
          if (cacaVisible) dibujarCaca(destino.x, destino.y);
          dibujarPersona(duenoX, destino.y - 22, { pelo: '#2d3436', remera: '#00b894', caminando, agachado: duenoAgachado });
          if (duenoAgachado) dibujarBolsa(duenoX + 16, destino.y - 4);
          linea(duenoX + 14, destino.y - 58, px + 10, destino.y - 18, 1.5, '#c0392b'); // correa
          if (perroAgachado && !a.e.testigo) {
            ctx.fillStyle = '#333';
            ctx.font = '16px serif';
            ctx.textAlign = 'center';
            ctx.fillText('♪', duenoX + 8 + Math.sin(reloj * 4) * 3, destino.y - 108 - (reloj * 20) % 14);
          }
          if (a.puteada && reloj < a.puteadaHasta) dibujarGlobo(duenoX, destino.y - 150, a.puteada);
        } },
        { y: destino.y, dibujar: () => dibujarPerro(px, destino.y, { agachado: perroAgachado }) },
      ];
    }
    if (tipo === 'pibe-vereda') {
      // Un pibe pasa tomando algo y revolea el vaso. Si el viejo lo agarra antes, sale corriendo a escobazos.
      const cae = posicionObjeto('vereda', a.e.lugar);
      const frena = Math.min(ANCHO - 60, cae.x + 70);
      let x;
      let corriendo = false;
      let dir = -1;
      if (a.fase === 'entrando') x = lerp(ANCHO + 30, frena, suave(limitar(p / 0.8)));
      else if (a.fase === 'saliendo') x = frena - a.s * 80;
      else { x = frena + a.s * 170; corriendo = true; dir = 1; }
      const tira = a.fase === 'entrando' && p > 0.8;
      const figuras = [{ y: 462, dibujar: () => {
        dibujarPersona(x, 462, { pelo: '#d35400', remera: '#f39c12', caminando: !corriendo, corriendo, dir, brazoArriba: tira || corriendo });
        if (a.fase === 'entrando' && !tira) dibujarBasura(x - 14, 430, 1); // el vaso en la mano
        if (a.fase === 'huyendo' && a.s < 0.45) {
          ctx.fillStyle = '#c0392b';
          ctx.font = 'bold 22px system-ui';
          ctx.textAlign = 'center';
          ctx.fillText('¡PAF!', x - 10, 380 + a.s * 20);
        }
        if (a.fase === 'huyendo' && a.s < 1.4) dibujarGlobo(x, 300, a.grito); // más arriba que el del viejo
      } }];
      if (tira) {
        const t = (p - 0.8) / 0.2;
        figuras.push({ y: 999, dibujar: () => dibujarBasura(lerp(x - 14, cae.x, t), lerp(430, cae.y, t) - Math.sin(t * Math.PI) * 40, 1) });
      }
      return figuras;
    }
    if (tipo === 'vecino-patio') {
      // El vecino se asoma por la medianera con la bolsa y la revolea por arriba.
      // Si el viejo está en el patio, se esconde enseguida haciéndose el distraído.
      const tira = a.fase === 'entrando' && p > 0.8;
      let asomo;
      if (a.fase === 'entrando') asomo = salirRebotando(limitar(p / 0.3));
      else if (a.fase === 'huyendo') asomo = 1 - limitar((a.s - 0.6) / 0.25); // se queda un instante, culpable
      else asomo = 1 - limitar(a.s / 0.5);
      const x = ANCHO + 30 - asomo * 70;
      const figuras = [{ y: 90, dibujar: () => {
        dibujarPersona(x, 100, { pelo: '#999', remera: '#e17055', dir: -1, brazoArriba: a.fase === 'entrando' && p > 0.65 });
        if (a.fase === 'entrando' && !tira) dibujarBolsa(x - 22, p > 0.65 ? 18 : 62);
        ctx.fillStyle = '#b5835a'; // medianera
        ctx.fillRect(ANCHO - 12, 0, 12, 150);
        if (a.fase === 'huyendo' && a.s < 1.6) dibujarGlobo(x - 60, 152, a.grito); // abajo, para no pisar al viejo
      } }];
      if (tira) {
        const t = (p - 0.8) / 0.2;
        const cae = posicionObjeto('patio', a.e.lugar);
        figuras.push({ y: 999, dibujar: () => dibujarBolsa(lerp(x - 10, cae.x, t), lerp(30, cae.y, t) - Math.sin(t * Math.PI) * 45) });
      }
      return figuras;
    }
    // Los nietos suben corriendo por el caminito y entran por la puerta de calle a dar vueltas
    // con las zapatillas embarradas. Si el abuelo está en la casa, frenan en la puerta,
    // se sacan las zapatillas y entran en puntas de pie, en medias.
    const LLEGADA = V.CONFIG.espantable.llegada;
    const figuras = [];
    for (let i = 0; i < 2; i++) {
      const puerta = { x: 118 + i * 16, y: 342 };
      let x;
      let y;
      let corriendo = true;
      let caminando = false;
      if (a.fase === 'entrando' && p < LLEGADA) {
        const t = suave(p / LLEGADA);
        x = puerta.x;
        y = lerp(470 + i * 12, puerta.y, t);
      } else if (a.fase === 'entrando') {
        const adentro = suave(limitar((p - LLEGADA) / 0.15));
        const ang = (p - LLEGADA) * Math.PI * 4.4 + i * Math.PI;
        x = lerp(puerta.x, 230 + Math.cos(ang) * 95, adentro);
        y = lerp(puerta.y, 280 + Math.sin(ang) * 32, adentro);
        a.ninos[i] = { x, y };
        if (Math.random() < 0.25) pisadas.push({ x, y, vida: 1.6 });
      } else if (a.fase === 'huyendo') {
        const t = suave(limitar((a.s - 0.6) / 1.6));
        x = lerp(puerta.x, 50 + i * 26, t);
        y = lerp(puerta.y, 300 - i * 18, t);
        corriendo = false;
        caminando = a.s > 0.6;
        if (i === 0) {
          // Las zapatillas embarradas saltan y quedan en la puerta.
          const vuelo = limitar(a.s / 0.4);
          for (let k = 0; k < 4; k++) {
            const zx = 104 + k * 13 + vuelo * (k - 1.5) * 6;
            const zy = 352 - Math.sin(vuelo * Math.PI) * 18;
            figuras.push({ y: zy, dibujar: () => {
              ctx.fillStyle = k % 2 ? '#e74c3c' : '#2e86de';
              ctx.beginPath(); ctx.ellipse(zx, zy, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
              ctx.fillStyle = '#5c3c1e';
              ctx.fillRect(zx - 6, zy + 1, 12, 2);
            } });
          }
        }
      } else {
        const desde = a.ninos[i] || { x: 230, y: 280 };
        const t = limitar(a.s / 1.2);
        x = lerp(desde.x, 125 + i * 14, t);
        y = lerp(desde.y, 620, t); // salen por el portón y se pierden abajo
      }
      const anterior = a.ninos[`prev${i}`];
      const dir = anterior && x < anterior ? -1 : 1;
      a.ninos[`prev${i}`] = x;
      figuras.push({ y, dibujar: () => {
        dibujarPersona(x, y, { pelo: i ? '#f39c12' : '#5a3418', remera: i ? '#9b59b6' : '#e74c3c', chico: true, corriendo, caminando, dir });
        if (i === 0 && a.fase === 'huyendo' && a.s < 1.8) dibujarGlobo(x + 40, y - 52, a.grito);
      } });
    }
    return figuras;
  }

  // Globo de diálogo arriba de (x, y). Las frases largas van en dos renglones, nunca tapa las
  // barras de la derecha y, si arriba no entra, va a `yAbajo` en vez de taparle la cara a nadie.
  const ANCHO_GLOBO = 270;
  function dibujarGlobo(x, y, texto, yAbajo) {
    ctx.font = 'bold 14px system-ui';
    const renglones = [];
    for (const palabra of texto.split(' ')) {
      const ultimo = renglones[renglones.length - 1];
      if (ultimo && ctx.measureText(`${ultimo} ${palabra}`).width <= ANCHO_GLOBO - 20) renglones[renglones.length - 1] = `${ultimo} ${palabra}`;
      else renglones.push(palabra);
    }
    const ancho = Math.max(...renglones.map((t) => ctx.measureText(t).width)) + 20;
    const alto = 12 + renglones.length * 18;
    const bx = Math.max(10, Math.min(ANCHO - ancho - 40, x - 30)); // sin tapar las barras
    let by = y - 10 - alto;
    if (by < 6) by = yAbajo !== undefined ? yAbajo : 6;
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(bx, by, ancho, alto, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#222';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    renglones.forEach((t, k) => ctx.fillText(t, bx + 10, by + 15 + k * 18));
  }

  function dibujarHud() {
    ctx.fillStyle = '#222';
    ctx.fillRect(0, 540, ANCHO, ALTO - 540);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 26px system-ui';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${Math.floor(estado.segundos)}s`, 16, 572);
    ctx.font = 'bold 18px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(`Récord ${record}s`, ANCHO - 16, 572);
    ctx.fillStyle = '#aaa';
    ctx.font = '13px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Tocá una zona para ir · mantené para trabajar', ANCHO / 2, 606);
    ctx.fillText('Si llegás antes de que ensucien, se van', ANCHO / 2, 626);
  }

  function dibujarFin() {
    const t = suave(limitar((reloj - finDesde) / 0.4));
    ctx.fillStyle = `rgba(20,20,20,${0.95 * t})`;
    ctx.fillRect(0, 0, ANCHO, ALTO);
    ctx.save();
    ctx.globalAlpha = t;
    ctx.translate(0, (1 - t) * 30);
    dibujarViejo(ANCHO / 2, 170, { paso: 0, triste: true });
    Lienzo.textoCentrado(ctx, 'Se te vino la noche, abuelo.', 215, 22, '#fff');
    Lienzo.textoCentrado(ctx, CAUSAS[estado.perdioPor], 245, 16, '#ccc');
    Lienzo.textoCentrado(ctx, `${Math.floor(estado.segundos)}s`, 310, 64, '#ffd34d');
    const nuevo = Math.floor(estado.segundos) > recordAnterior; // empatar no es récord
    Lienzo.textoCentrado(ctx, nuevo ? '¡Nuevo récord!' : `Tu récord: ${record}s`, 365, 18, nuevo ? '#7bed9f' : '#ccc');
    const logros = [];
    if (estado.perrosEspantados > 0) logros.push(`Perros espantados: ${estado.perrosEspantados}`);
    if (estado.cacasLevantadas > 0) logros.push(`Dueños avergonzados: ${estado.cacasLevantadas}`);
    if (estado.pibesCorridos > 0) logros.push(`Pibes corridos a escobazos: ${estado.pibesCorridos}`);
    if (estado.vecinosRetados > 0) logros.push(`Vecinos retados: ${estado.vecinosRetados}`);
    if (estado.zapatillasAfuera > 0) logros.push(`Nietos en medias: ${estado.zapatillasAfuera}`);
    logros.forEach((texto, k) => Lienzo.textoCentrado(ctx, texto, 395 + k * 21, 15, '#ccc'));
    ctx.fillStyle = '#ffd34d';
    ctx.beginPath(); ctx.roundRect(30, 510, ANCHO - 60, 56, 14); ctx.fill();
    Lienzo.textoCentrado(ctx, REINTENTAR[estado.perdioPor], 538, 15, '#222');
    Lienzo.textoCentrado(ctx, 'INERA SARA', ALTO - 30, 14, '#777');
    ctx.restore();
  }

  // ---------- Reacciones, partículas y frases ----------
  function decir(texto, segundos) {
    globo = { texto, hasta: reloj + (segundos || 2.4) };
  }

  function reaccionar(dt, viejo, caminando, trabajando) {
    if (!caminando) zonaQuieta = V.zonaActual(estado);
    if (caminando && !estabaCaminando && !globo && Math.random() < 0.4) decir(azar(FRASES.caminar), 1.2);
    if (!caminando && estabaCaminando) {
      for (let k = 0; k < 6; k++) particulas.push({ x: viejo.x + (Math.random() - 0.5) * 20, y: viejo.y, vx: (Math.random() - 0.5) * 60, vy: -20 - Math.random() * 30, vida: 0.35, color: 'rgba(120,100,80,0.6)', g: 60 });
    }
    estabaCaminando = caminando;

    for (const e of estado.recienPuteadas) {
      const actor = actores.find((a) => a.e === e);
      if (actor) {
        actor.puteada = azar(FRASES.duenoAtrapado);
        actor.puteadaHasta = reloj + 1.8;
      }
    }
    for (const e of estado.recienLevantadas) {
      const actor = actores.find((a) => a.e === e);
      if (actor) {
        actor.puteada = azar(FRASES.duenoSeVa);
        actor.puteadaHasta = reloj + 2.6;
      }
      decirLuego = { texto: azar(FRASES.viejoGana), en: reloj + 1.3 };
    }
    for (const e of estado.recienCaidos) {
      sacudon = 0.2;
      SONIDOS.plop();
      vibrar(30);
      if (e.tipo === 'nietos') decir(azar(FRASES.nietos));
      else if (e.tipo === 'vecino') decir(azar(FRASES.vecinoPatio));
      else if (e.tipo === 'pibe') decir(azar(FRASES.pibeTiro));
      else decir(azar(e.conDueno ? FRASES.perroDuenoDistraido : FRASES.perroSolo));
    }
    for (const e of estado.recienEspantados) {
      vibrar(15);
      if (e.tipo === 'pibe') {
        SONIDOS.paf();
        setTimeout(SONIDOS.paf, 160);
        escobazoHasta = reloj + 0.9;
        decir(azar(FRASES.escobazos));
        const actor = actores.find((a) => a.e === e);
        if (actor) actor.grito = azar(FRASES.pibeHuye);
      } else if (e.tipo === 'nietos') {
        SONIDOS.fuera();
        decir(azar(FRASES.retarNietos));
        const actor = actores.find((a) => a.e === e);
        if (actor) actor.grito = azar(FRASES.nietosObedecen);
      } else if (e.tipo === 'vecino') {
        SONIDOS.fuera();
        decir(azar(FRASES.retarVecino));
        const actor = actores.find((a) => a.e === e);
        if (actor) actor.grito = azar(FRASES.vecinoSeEsconde);
      } else {
        SONIDOS.fuera();
        decir(azar(FRASES.espantar));
      }
    }
    if (decirLuego && reloj >= decirLuego.en) {
      decir(decirLuego.texto);
      decirLuego = null;
    }
    if (trabajando && !estabaTrabajando && !globo && Math.random() < 0.35) {
      const zona = V.ZONAS[V.zonaActual(estado)];
      decir(azar(FRASES[`trabajar${zona[0].toUpperCase()}${zona.slice(1)}`]), 1.8);
    }
    estabaTrabajando = trabajando;

    if (trabajando) {
      const zona = V.ZONAS[V.zonaActual(estado)];
      if (reloj >= proximoSonidoTrabajo) {
        ({ patio: SONIDOS.cortar, casa: SONIDOS.frotar, vereda: SONIDOS.barrer })[zona]();
        proximoSonidoTrabajo = reloj + (zona === 'casa' ? 0.18 : 0.28);
      }
      if (zona === 'casa') {
        if (Math.random() < 0.4) particulas.push({ x: viejo.x + 30 + Math.random() * 20, y: viejo.y - 70, vx: (Math.random() - 0.5) * 30, vy: -20, vida: 0.9, color: 'rgba(255,255,255,0.9)', g: -10, burbuja: true });
      } else {
        for (let k = 0; k < 2; k++) {
          particulas.push({
            x: viejo.x + 34 + Math.random() * 16,
            y: viejo.y - (zona === 'patio' ? 44 : 4),
            vx: 40 + Math.random() * 110,
            vy: -60 - Math.random() * 90,
            vida: 0.6,
            color: zona === 'patio' ? '#3a9a2a' : '#c8a878',
            g: 300,
          });
        }
      }
    }
    for (const lista of [particulas, pisadas, toques]) for (const p of lista) p.vida -= dt;
    particulas = particulas.filter((p) => p.vida > 0);
    pisadas = pisadas.filter((p) => p.vida > 0);
    toques = toques.filter((p) => p.vida > 0);
    for (const p of particulas) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += p.g * dt;
    }

    proximaFraseSuelta -= dt;
    if (proximaFraseSuelta <= 0) {
      if (!globo && !caminando) {
        const peor = V.ZONAS.reduce((a, z) => (estado.problemas[z] > estado.problemas[a] ? z : a));
        decir(azar(FRASES[peor]), 2.8);
      }
      proximaFraseSuelta = 9 + Math.random() * 5;
    }
    if (globo && reloj > globo.hasta) globo = null;
    sacudon = Math.max(0, sacudon - dt);
  }

  Lienzo.bucle((dt) => {
    reloj += dt;
    const estabaJugando = estado.fase === 'jugando';
    V.paso(estado, dt, entrada);
    if (estabaJugando && estado.fase === 'fin') {
      recordAnterior = record;
      record = Lienzo.guardarRecord(CLAVE_RECORD, Math.floor(estado.segundos));
      finDesde = reloj;
      SONIDOS.perder();
      vibrar(200);
    }
    const viejo = posicionViejo(estado.y);
    if (posViejoPrevia) distanciaCaminada += Math.hypot(viejo.x - posViejoPrevia.x, viejo.y - posViejoPrevia.y);
    posViejoPrevia = viejo;
    const caminando = Math.abs(estado.y - V.zonaActual(estado)) >= 0.05;
    const trabajando = entrada.trabajar && !caminando && estado.fase === 'jugando';
    sincronizarActores(dt);
    reaccionar(dt, viejo, caminando, trabajando);

    ctx.save();
    if (sacudon > 0) {
      const fuerza = (sacudon / 0.2) * 5;
      ctx.translate((Math.random() - 0.5) * fuerza, (Math.random() - 0.5) * fuerza);
    }
    dibujarPatio(estado.problemas.patio);
    dibujarCasa(estado.problemas.casa);
    dibujarAdelante(estado.problemas.vereda);
    for (const p of pisadas) {
      ctx.fillStyle = `rgba(92, 60, 30, ${0.5 * Math.min(1, p.vida)})`;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 3, 5, 0.3, 0, Math.PI * 2); ctx.fill();
    }
    V.ZONAS.forEach(dibujarAlerta);

    // Personajes ordenados por profundidad: el de más abajo tapa al de más arriba.
    const figuras = actores.flatMap(figurasActor);
    figuras.push({ y: viejo.y, dibujar: () => dibujarViejo(viejo.x, viejo.y, {
      paso: distanciaCaminada * 0.16,
      trabajando: trabajando || reloj < escobazoHasta,
      herramienta: V.ZONAS[V.zonaActual(estado)],
    }) });
    figuras.sort((a, b) => a.y - b.y).forEach((f) => f.dibujar());

    for (const p of particulas) {
      ctx.fillStyle = p.color;
      if (p.burbuja) { ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(p.x, p.y, 4, 4);
    }
    for (const t of toques) {
      ctx.strokeStyle = `rgba(255,255,255,${t.vida / 0.4})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(t.x, t.y, 10 + (0.4 - t.vida) * 60, 0, Math.PI * 2); ctx.stroke();
    }
    V.ZONAS.forEach((z, i) => dibujarBarra(z, i, caminando));
    if (globo) dibujarGlobo(viejo.x, viejo.y - 100, globo.texto, viejo.y + 6);
    ctx.restore();
    dibujarHud();
    if (estado.fase === 'fin') dibujarFin();
  });
</script>
